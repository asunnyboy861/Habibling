name: Habibling
options:
  bundleIdPrefix: com.zzoutuo
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: JP4TN5PTS3
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "Apple Development"
targets:
  Habibling:
    type: application
    platform: iOS
    sources:
      - path: Habibling
      - path: Shared
    dependencies:
      - target: HabiblingWidgets
        embed: true
      - target: HabiblingWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zzoutuo.Habibling
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: Habibling
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Habibling/Habibling.entitlements
    info:
      path: Habibling/Info.plist
      properties:
        BGTaskSchedulerPermittedIdentifiers:
          - com.zzoutuo.Habibling.refresh
        UIBackgroundModes:
          - processing
          - remote-notification
        CFBundleURLTypes:
          - CFBundleURLName: com.zzoutuo.Habibling
            CFBundleURLSchemes:
              - habibling
        NSMicrophoneUsageDescription: "Habibling uses the microphone to record voice notes that are transcribed on your device."
        NSSpeechRecognitionUsageDescription: "Habibling transcribes your voice notes privately on your device."
        ITSAppUsesNonExemptEncryption: false
  HabiblingWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: HabiblingWidgets
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zzoutuo.Habibling.Widgets
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Habibling Widgets
        CODE_SIGN_ENTITLEMENTS: HabiblingWidgets/HabiblingWidgets.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: HabiblingWidgets/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  HabiblingWatch:
    type: application
    platform: watchOS
    sources:
      - path: HabiblingWatch
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zzoutuo.Habibling.watchkitapp
        TARGETED_DEVICE_FAMILY: "4"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Habibling
        INFOPLIST_KEY_WKApplication: YES
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.zzoutuo.Habibling
        CODE_SIGN_ENTITLEMENTS: HabiblingWatch/HabiblingWatch.entitlements
  HabiblingTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: HabiblingTests
    dependencies:
      - target: Habibling
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zzoutuo.HabiblingTests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Habibling:
    build:
      targets:
        Habibling: all
        HabiblingTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - HabiblingTests
      storeKitConfiguration: Habibling.storekit
